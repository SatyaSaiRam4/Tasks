# Pings the API every 10 minutes so the Render instances and the database stay
# awake. Without it, the first request after ~15 idle minutes waits for the
# server to start (up to about a minute). Free for public repositories.
#
# Memo runs the same backend on two Render services (same code, same
# database); the app uses whichever is up. Repository secrets:
#   API_URL         e.g. https://tasks-singapore.onrender.com
#   API_URL_BACKUP  e.g. https://tasks-wvlv.onrender.com (optional)
# Each is pinged on its own; the run passes if at least one answers.
#
# Render's free instance hours are counted per workspace: two services kept
# awake all month use about twice the hours of one. Leave API_URL_BACKUP
# unset to let the backup sleep (the app then waits for it to start, up to a
# minute, only when the main one is down).
name: Keep awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the APIs and the database
        env:
          API_URL: ${{ secrets.API_URL }}
          API_URL_BACKUP: ${{ secrets.API_URL_BACKUP }}
        run: |
          up=0
          for url in "$API_URL" "$API_URL_BACKUP"; do
            [ -z "$url" ] && continue
            if curl --silent --show-error --fail --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 "$url/health/ready"; then
              echo " <- $url is up"; up=$((up + 1))
            else
              echo "::warning::$url didn't answer"
            fi
          done
          [ "$up" -gt 0 ]

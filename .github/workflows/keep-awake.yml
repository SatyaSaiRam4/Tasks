# Pings the API every 10 minutes so the Render instance and the database stay
# awake. Without it, the first request after ~15 idle minutes waits for the
# server to start (up to about a minute). Free for public repositories.
#
# Needs the API_URL repository secret, e.g. https://tasks-singapore.onrender.com
name: Keep awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API and the database
        run: curl --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 "${{ secrets.API_URL }}/health/ready"

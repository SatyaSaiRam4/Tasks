# Once a day: wakes the API and the database, settles every user's streak
# points, and deletes plans, tasks and done reminders that are more than 7 days
# past their end. The Vault is never touched.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   API_URL      e.g. https://tasks-singapore.onrender.com
#   CRON_SECRET  the same value as CRON_SECRET on the server
name: Daily cleanup

on:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake the API
        # A sleeping Render instance can take about a minute to start.
        run: curl --silent --show-error --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 "${{ secrets.API_URL }}/health/ready"
      - name: Run cleanup
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 15 --max-time 300 \
            -X POST -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.API_URL }}/api/v1/maintenance/cleanup"

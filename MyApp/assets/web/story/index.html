<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <!--
      The welcome story's 3D stage. story.bundle.js is built from
      MyApp/web/story/story.js (npm run build:story); don't edit it by hand.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        -webkit-user-select: none;
        user-select: none;
        font-family: 'Manrope', system-ui, sans-serif;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #bubbles {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .bubble {
        position: absolute;
        left: 0;
        top: 0;
        max-width: 68%;
        padding: 12px 16px;
        border-radius: 18px;
        background: #efe9dc;
        color: #0b1122;
        font-size: 15.5px;
        line-height: 21px;
        font-weight: 600;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        opacity: 0;
        scale: 0.6;
        transform-origin: var(--tail, 50%) 100%;
        transition: opacity 260ms ease, scale 420ms cubic-bezier(0.2, 1.4, 0.4, 1);
      }
      .bubble.gold {
        background: #d4af6a;
      }
      .bubble.thought {
        background: rgba(239, 233, 220, 0.16);
        color: #efe9dc;
        border: 1px solid rgba(239, 233, 220, 0.35);
        backdrop-filter: blur(6px);
        border-radius: 26px;
        font-style: italic;
      }
      .bubble.on {
        opacity: 1;
        scale: 1;
      }
      .bubble::after {
        content: '';
        position: absolute;
        bottom: -7px;
        left: calc(var(--tail, 50%) - 8px);
        width: 16px;
        height: 16px;
        background: inherit;
        transform: rotate(45deg);
        border-radius: 3px;
      }
      .bubble.thought::after {
        width: 10px;
        height: 10px;
        bottom: -16px;
        border-radius: 50%;
        transform: none;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="bubbles"></div>
    <script>
      // Report any failure, so the app can fall back to the 2D story.
      window.addEventListener('error', function () {
        if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage('error');
      });
    </script>
    <script src="story.bundle.js"></script>
  </body>
</html>

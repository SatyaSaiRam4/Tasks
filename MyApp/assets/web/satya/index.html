<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <!--
      Melo, Memo's guide, in 3D with his name in gold on his robe.
      melo.bundle.js is built from MyApp/web/satya/melo.js (npm run build:melo);
      don't edit it by hand. The model is MyApp/assets/models/model.glb and the
      lettering uses MyApp/assets/fonts/CormorantGaramond-Bold.ttf.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }
      #stage {
        width: 100%;
        height: 100%;
        display: block;
        opacity: 0;
        transform: scale(0.82) translateY(16px);
        transition-property: opacity, transform;
        transition-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #stage.ready {
        opacity: 1;
        transform: none;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script src="melo.bundle.js"></script>
  </body>
</html>

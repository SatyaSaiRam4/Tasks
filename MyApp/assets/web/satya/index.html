<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }
      model-viewer {
        width: 100%;
        height: 100%;
        background: transparent;
        --poster-color: transparent;
        --progress-bar-color: transparent;
        opacity: 0;
        transform: scale(0.82) translateY(16px);
        transition-property: opacity, transform;
        transition-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      model-viewer.ready {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
      #puppet {
        width: 100%;
        height: 100%;
        transform-origin: 50% 92%;
        will-change: transform;
      }
    </style>
  </head>
  <body>
    <!--
      Melo. The model file is MyApp/assets/models/model.glb; replace it with
      any GLB and rebuild the app. Embedded animations play automatically,
      preferring one named "idle".

      The current model is a glove puppet with no skeleton, so Melo is
      animated as a whole puppet here: an idle sway and breath, plus gestures
      the app triggers with window.satya.play(name): talk, wave, hop, nod,
      spin, lookLeft, lookRight, cheer, walk, think;
      several at once play in order, e.g. play('walk,wave').
    -->
    <div id="puppet">
    <model-viewer
      id="mv"
      alt="Melo, your guide"
      autoplay
      loading="eager"
      reveal="auto"
      interaction-prompt="none"
      disable-zoom
      disable-pan
      disable-tap
      tone-mapping="aces"
      exposure="1.05"
      shadow-intensity="0.9"
      shadow-softness="1"
      environment-image="neutral"
      camera-orbit="0deg 78deg 105%"
      interpolation-decay="20"
      field-of-view="28deg"
    ></model-viewer>
    </div>
    <script src="model-viewer-umd.min.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var reduced = params.get('motion') === 'reduced';
        var longIntro = params.get('intro') === 'long';
        var mv = document.getElementById('mv');

        function post(msg) {
          if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg);
        }

        // No WebGL, no 3D: let the app show its fallback immediately.
        try {
          var c = document.createElement('canvas');
          if (!(c.getContext('webgl2') || c.getContext('webgl'))) {
            post('nowebgl');
            return;
          }
        } catch (e) {
          post('nowebgl');
          return;
        }

        mv.style.transitionDuration = reduced ? '0ms' : longIntro ? '1100ms' : '450ms';
        var puppet = document.getElementById('puppet');

        // ---- Puppet motion ----------------------------------------------------
        var DURATION = { talk: 1800, wave: 1400, hop: 900, nod: 1000, spin: 1400, lookLeft: 1300, lookRight: 1300, cheer: 1700, walk: 1500, think: 1800 };
        var gesture = null;
        var started = 0;
        var queue = [];

        function bump(p) {
          return Math.sin(Math.PI * Math.min(1, Math.max(0, p)));
        }
        function ease(p) {
          return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        }

        function play(name) {
          if (reduced || !DURATION[name]) return;
          if (gesture) {
            queue.push(name);
            return;
          }
          gesture = name;
          started = performance.now();
        }
        window.satya = {
          play: play,
          // Replace whatever is playing, e.g. when a new tour step starts.
          now: function (name) {
            queue = [];
            gesture = null;
            String(name)
              .split(',')
              .forEach(function (n) {
                play(n.trim());
              });
          },
        };

        function frame(now) {
          var t = now / 1000;
          // Idle: a slow look around, breathing and a soft bob.
          var yaw = 14 * Math.sin(t * 0.55);
          var pitch = 0;
          var roll = 3 * Math.sin(t * 0.9);
          var y = 1.5 * Math.sin(t * 1.8);
          var sx = 1;
          var sy = 1 + 0.015 * Math.sin(t * 1.8);

          if (gesture) {
            var p = (now - started) / DURATION[gesture];
            if (p >= 1) {
              gesture = null;
              if (queue.length) play(queue.shift());
            } else if (gesture === 'talk') {
              var beat = Math.abs(Math.sin(p * Math.PI * 9));
              y -= 3 * beat;
              sy += 0.05 * beat;
              sx -= 0.02 * beat;
              roll += 4 * Math.sin(p * Math.PI * 4);
            } else if (gesture === 'wave') {
              roll += 18 * Math.sin(p * Math.PI * 6) * (1 - p);
              yaw += 10 * bump(p);
            } else if (gesture === 'hop' || gesture === 'cheer') {
              var hp = gesture === 'cheer' ? Math.min(1, p * 1.6) : p;
              var air = hp > 0.15 && hp < 0.85 ? bump((hp - 0.15) / 0.7) : 0;
              var land = hp <= 0.15 ? bump(hp / 0.15) : hp >= 0.85 ? bump((hp - 0.85) / 0.15) : 0;
              y -= 22 * air;
              sy += 0.1 * air - 0.12 * land;
              sx += 0.08 * land - 0.04 * air;
              if (gesture === 'cheer') yaw += 360 * ease(p);
            } else if (gesture === 'nod') {
              pitch += 14 * Math.sin(p * Math.PI * 4) * (1 - p);
            } else if (gesture === 'spin') {
              yaw += 360 * ease(p);
              y -= 6 * bump(p);
            } else if (gesture === 'walk') {
              // A puppet's waddle: rock side to side with a little hop each step.
              var step = Math.sin(p * Math.PI * 6);
              roll += 9 * step;
              y -= 5 * Math.abs(step);
              sy += 0.03 * Math.abs(step);
              yaw += 20 * Math.sin(p * Math.PI * 2);
            } else if (gesture === 'think') {
              pitch -= 8 * bump(p);
              roll -= 7 * bump(p);
              yaw += 22 * bump(p);
            } else if (gesture === 'lookLeft' || gesture === 'lookRight') {
              yaw += (gesture === 'lookLeft' ? -42 : 42) * bump(p);
              roll += (gesture === 'lookLeft' ? -6 : 6) * bump(p);
            }
          }

          // Turning moves the camera around Melo's middle (the model's own
          // origin is off-center, so rotating the model would swing it
          // sideways); the side-to-side tilt is a plain 2D rotation.
          mv.cameraOrbit = (-yaw).toFixed(2) + 'deg ' + (78 - pitch).toFixed(2) + 'deg 105%';
          puppet.style.transform =
            'translateY(' + y.toFixed(2) + '%) rotate(' + roll.toFixed(2) + 'deg) scale(' + sx.toFixed(3) + ',' + sy.toFixed(3) + ')';
          requestAnimationFrame(frame);
        }

        mv.addEventListener('load', function () {
          var clips = mv.availableAnimations || [];
          if (clips.length) {
            var idle = clips.filter(function (n) {
              return /idle|breath/i.test(n);
            })[0];
            mv.animationName = idle || clips[0];
            if (!reduced) mv.play();
          }
          requestAnimationFrame(function () {
            mv.classList.add('ready');
          });
          if (!reduced) {
            requestAnimationFrame(frame);
            play(params.get('gesture') || (longIntro ? 'wave' : 'nod'));
          }
          post('loaded');
        });
        mv.addEventListener('error', function () {
          post('error');
        });

        // model-viewer loads with fetch(), which Chromium refuses for file://
        // URLs. XHR is allowed (the WebView enables file access), so read the
        // bundled GLB here and hand model-viewer a blob: URL instead.
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '../../models/model.glb');
        xhr.responseType = 'arraybuffer';
        xhr.onload = function () {
          if (!xhr.response || !xhr.response.byteLength) {
            post('error');
            return;
          }
          var blob = new Blob([xhr.response], { type: 'model/gltf-binary' });
          mv.src = URL.createObjectURL(blob);
        };
        xhr.onerror = function () {
          post('error');
        };
        xhr.send();
      })();
    </script>
  </body>
</html>

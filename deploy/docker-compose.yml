# Run the API behind Nginx on a VPS:
#   cd deploy && docker compose up -d --build
# The API reads its settings (database, secrets) from Backend/.env.
services:
  api:
    build: ../Backend
    env_file: ../Backend/.env
    restart: unless-stopped
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

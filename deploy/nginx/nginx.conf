# Nginx in front of the Memo API (FastAPI/uvicorn).
#
# What it does for speed:
#  - Keeps warm keep-alive connections to uvicorn, so each app request skips
#    a fresh TCP handshake to the backend.
#  - Gzips JSON responses (plan grids and dashboards shrink ~70-80%).
#  - Serves HTTP/2 to the app when TLS is enabled below.
#
# API responses are per-user and authenticated, so they are never cached
# here: a shared cache could hand one user's data to another.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json text/plain text/css application/javascript;

    log_format main '$remote_addr "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    upstream memo_api {
        # One uvicorn process: the reminder worker runs inside it and must
        # not be duplicated (see PROJECT.md, operational notes).
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Vault notes and profile updates are small; reject anything huge.
        client_max_body_size 2m;

        location / {
            proxy_pass http://memo_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_buffering on;
            # Responses must never be stored by any shared cache.
            add_header Cache-Control "no-store" always;
        }

        location = /health {
            proxy_pass http://memo_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }
    }

    # TLS (on a VPS, after `certbot certonly --webroot` or similar):
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name api.example.com;
    #     ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    #     ... same location blocks as above ...
    # }
}
